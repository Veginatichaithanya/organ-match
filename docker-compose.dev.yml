services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development

  frontend:
    ports:
      - "5173:3000"
    environment:
      - NODE_ENV=development

  nginx:
    ports:
      - "8080:80"
