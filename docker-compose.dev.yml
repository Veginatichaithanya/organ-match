services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/migrations:/app/migrations
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=${DATABASE_URL}
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/app
        - path: ./backend/tests
          action: sync
          target: /app/tests

  nginx:
    ports:
      - "8080:80" # Bind proxy to port 8080 during dev to prevent interference with local processes
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

